<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Owner · Rent a Vacuum</title>
  <meta name="theme-color" content="#16150f" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%2316150f'/%3E%3Crect x='18' y='22' width='28' height='28' rx='6' fill='%23ffd23f'/%3E%3Crect x='14' y='16' width='36' height='9' rx='4' fill='%23fff'/%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
  <style>
    .login { min-height: 100vh; display: grid; place-items: center; padding: 24px 16px; }
    .login .card { width: min(400px, 100%); padding: 30px; }
    .login h1 { font: 800 30px/1 var(--display); letter-spacing: -.03em; margin: 16px 0 6px; }
    .lock { width: 52px; height: 52px; border-radius: 16px; background: var(--ink); display: grid; place-items: center; }
    .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 18px; }
    .stat { padding: 18px; }
    .stat span { font-size: 12.5px; color: var(--ink-3); text-transform: uppercase; letter-spacing: .06em; font-weight: 600; }
    .stat b { display: block; font: 800 32px/1.1 var(--display); letter-spacing: -.03em; margin-top: 4px; }
    .stat.hl { background: var(--accent); border-color: var(--accent); }
    .stat.hl span { color: var(--accent-ink); opacity: .7; }
    .tabs { display: flex; gap: 6px; background: var(--bg); padding: 5px; border-radius: 14px; width: max-content; max-width: 100%; overflow-x: auto; }
    .tab { border: 0; background: transparent; padding: 8px 14px; border-radius: 10px; font-weight: 600; font-size: 14px; color: var(--ink-2); white-space: nowrap; }
    .tab.on { background: var(--paper); color: var(--ink); box-shadow: 0 1px 3px rgba(0,0,0,.1); }
    .tab .n { display: inline-block; margin-left: 4px; min-width: 20px; padding: 0 6px; border-radius: 9px; background: var(--line); font-size: 12px; }
    .tab.on .n { background: var(--accent); }
    .panel { padding: 22px; margin-bottom: 18px; }
    .panel-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 14px; }
    .panel-head h2 { font: 800 22px/1 var(--display); margin: 0; letter-spacing: -.02em; }
    .bk { display: grid; grid-template-columns: 1fr auto; gap: 14px; align-items: center; padding: 16px; border: 1.5px solid var(--line); border-radius: 16px; margin-bottom: 10px; background: #fff; }
    .bk.pending { border-color: #f0d68a; background: #fffbea; }
    .bk .who { font: 700 17px/1.2 var(--display); }
    .bk .meta { font-size: 13.5px; color: var(--ink-2); margin-top: 3px; display: flex; flex-wrap: wrap; gap: 4px 14px; }
    .bk .meta a { text-decoration: none; font-weight: 600; }
    .bk .when { margin-top: 10px; display: flex; flex-wrap: wrap; gap: 6px; }
    .bk .notep { margin-top: 8px; font-size: 13.5px; color: var(--ink-2); background: var(--bg); padding: 8px 10px; border-radius: 10px; }
    .bk .right { display: flex; flex-direction: column; align-items: flex-end; gap: 8px; }
    .bk .amt { font: 800 22px/1 var(--display); }
    .bk .btns { display: flex; gap: 6px; }
    .empty { text-align: center; color: var(--ink-3); padding: 30px 10px; }
    .grid { display: grid; grid-template-columns: repeat(7, minmax(0,1fr)); gap: 5px; font-size: 12.5px; }
    .grid .h { text-align: center; font-weight: 700; color: var(--ink-2); padding: 4px 0; }
    .grid .h small { display: block; font-weight: 500; color: var(--ink-3); }
    .grid .tm { color: var(--ink-3); font-weight: 600; display: flex; align-items: center; }
    .cell { border: 1.5px solid var(--line); background: #fff; border-radius: 10px; min-height: 62px; padding: 5px 6px; text-align: left; font-size: 11.5px; line-height: 1.25; overflow: hidden; }
    .cell:hover { border-color: var(--ink); }
    .cell.pending { background: var(--pending); border-color: #f0d68a; }
    .cell.confirmed { background: var(--ink); color: #fff; border-color: var(--ink); }
    .cell.blocked { background: repeating-linear-gradient(-45deg, #eee9dd 0 5px, #f7f3ea 5px 10px); color: var(--ink-3); }
    .cell.past { opacity: .4; }
    .cell .dn { display: block; font-weight: 700; font-size: 11px; opacity: .7; margin-bottom: 2px; }
    .cell b { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .scrollx { overflow-x: auto; margin: 0 -4px; padding: 0 4px; }
    .scrollx .grid { min-width: 520px; }
    @media (max-width: 720px) {
      .stats { grid-template-columns: 1fr 1fr; }
      .bk { grid-template-columns: 1fr; }
      .bk .right { flex-direction: row; justify-content: space-between; align-items: center; }
      .panel { padding: 16px; }
    }
  </style>
</head>
<body>
  <div id="app"></div>
  <div class="toast" id="toast"></div>
  <script src="config.js"></script>
  <script src="admin.js"></script>
</body>
</html>
